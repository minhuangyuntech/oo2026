{% load static %}
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}我的部落格{% endblock %}</title>
  <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'mysite/css/site.css' %}">
</head>
<body>
<div class="container py-4">
  {% include 'mysite/header.html' %}
  <div class="row g-4">
    <aside class="col-12 col-md-3">
      <nav aria-label="網站導覽">
        <a href="{% url 'mysite:home' %}">文章首頁</a>
        <a href="https://news.google.com/">即時新聞</a>
        <a href="https://www.youtube.com/">YouTube</a>
      </nav>
      <p class="mt-3">Django 課堂實作</p>
    </aside>
    <main class="col-12 col-md-9">
      {% block headmessage %}{% endblock %}
      {% block content %}{% endblock %}
    </main>
  </div>
  {% include 'mysite/footer.html' %}
</div>

</body>
</html>
